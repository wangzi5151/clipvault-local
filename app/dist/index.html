<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipVault-Local · 剪贴板保险箱</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <span class="logo-dot"></span>
    <h1>剪贴板保险箱</h1>
    <span class="spacer"></span>
    <span class="status-pill recording" id="status-pill"><span class="dot"></span><span class="txt">记录中</span></span>
    <button class="btn" id="btn-toggle-rec">暂停记录</button>
  </header>

  <div class="searchbar">
    <input class="input" id="search" type="search" placeholder="搜索：输入手机号片段、地址关键词、日期…">
  </div>
  <div class="chips" id="chips"></div>

  <main class="main-split">
    <section class="entry-list" id="entry-list" aria-label="历史记录"></section>
    <aside class="preview-pane" id="preview-pane" aria-label="预览">
      <div class="preview-empty">点击左侧任意一条记录，在这里查看完整内容。<br>双击一条记录可直接复制。</div>
    </aside>
  </main>

  <footer class="statusbar">
    <span id="status-counts">正在加载…</span>
    <span class="spacer" style="flex:1"></span>
    <span>数据只保存在本机 · 无账号 · 无联网</span>
  </footer>

<script src="js/core.js"></script>
<script src="js/main.js"></script>
</body>
</html>
