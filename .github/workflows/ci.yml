name: ci

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:

jobs:
  go-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: go vet ./...
      - name: core regression tests
        run: go test -count=1 ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/clipvault-core .

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: syntax check js
        run: |
          for f in app/dist/js/*.js; do node --check "$f" && echo "OK $f"; done
      - name: validate all json
        run: |
          python3 - <<'PY'
          import glob, json
          files = sorted(glob.glob('app/**/*.json', recursive=True))
          for path in files:
              with open(path, encoding='utf-8') as fh:
                  json.load(fh)
              print('OK', path)
          PY
